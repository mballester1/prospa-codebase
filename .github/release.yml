changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    - title: New Features 🆕
      labels:
        - feature

    - title: Enhancements ✨
      labels:
        - enhancement

    - title: Bugs Smashed 🔨
      labels:
        - bug-fix

    - title: Other Changes
      labels:
        - "*"
